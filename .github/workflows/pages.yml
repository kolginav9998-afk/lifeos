name: pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test "tests/*.test.mjs"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Установить браузер для браузерных тестов
        run: |
          # axe-core нужен браузерной проверке доступности (tests/e2e-a11y.mjs); версия та же, что в package.json
          npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.14.0
          # Браузер Playwright ставится из интернета; при сбое зеркал или сети (бывает) берём Google Chrome, уже стоящий на машине.
          if ! timeout 420 npx playwright install --with-deps chromium; then
            echo "Не удалось поставить браузер Playwright: использую установленный Google Chrome"
            CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
            [ -n "$CHROME" ] || { echo "Google Chrome на машине не найден"; exit 1; }
            echo "PW_CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
            "$CHROME" --version
          fi
      - name: Браузерные тесты (задачи, модули, безопасность)
        run: npm run test:e2e

  deploy:
    needs: [test, e2e]          # сайт выкладывается только после юнит-тестов и браузерных сценариев
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать веб-часть (та же, что внутри APK)
        run: bash scripts/build-web.sh web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
