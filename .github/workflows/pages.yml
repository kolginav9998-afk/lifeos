name: pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test "tests/*.test.mjs"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Установить Chromium для браузерных тестов
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          # Системные пакеты берутся с зеркала Ubuntu; при его сбое повторяем, а потом ставим только сам браузер (для проверок шрифты не нужны)
          ok=0
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "Установка с системными пакетами не удалась (попытка $i из 3)"; sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "Зеркало Ubuntu недоступно: ставлю только браузер"
            npx playwright install chromium
          fi
      - name: Браузерные тесты (задачи, модули, безопасность)
        run: npm run test:e2e

  deploy:
    needs: [test, e2e]          # сайт выкладывается только после юнит-тестов и браузерных сценариев
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать веб-часть (та же, что внутри APK)
        run: bash scripts/build-web.sh web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
