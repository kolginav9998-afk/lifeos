name: apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node --test "tests/*.test.mjs"
      - name: Собрать веб-часть (та же, что на сайте)
        run: bash scripts/build-web.sh apk
      - name: Создать Android-проект и подтянуть веб-часть
        run: |
          npx cap add android
          npx cap sync android
      - name: Своя иконка приложения
        run: |
          cp -r assets/android-res/. android/app/src/main/res/
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F1115</color>
          </resources>
          XML
      - name: "Приватность Android — запретить автоматическое облачное резервирование данных приложения"
        run: |
          grep -q 'android:allowBackup="true"' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -n 'allowBackup' android/app/src/main/AndroidManifest.xml
      - name: Стабильная подпись (иначе новую версию нельзя поставить поверх старой)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Собрать debug-APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Подготовить файл и показать отпечаток подписи
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/lifeos.apk
          ls -l out
          keytool -printcert -jarfile out/lifeos.apk | grep -E 'Owner|SHA256' || true
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-apk
          path: out/lifeos.apk
          if-no-files-found: error
      - name: Опубликовать как «последний APK» (прямая ссылка для телефона)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk out/lifeos.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Life OS — последний APK" \
            --notes "Автосборка из коммита ${GITHUB_SHA::7}. Debug-подпись, ставится вручную."
