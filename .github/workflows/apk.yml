name: apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node --test "tests/*.test.mjs"
      - name: Собрать веб-часть (та же, что на сайте)
        run: bash scripts/build-web.sh apk
      - name: Создать Android-проект и подтянуть веб-часть
        run: |
          npx cap add android
          npx cap sync android
      - name: Своя иконка приложения
        run: |
          cp -r assets/android-res/. android/app/src/main/res/
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F1115</color>
          </resources>
          XML
      - name: "Правки Android-проекта: запрет облачного автобэкапа, постоянный ключ подписи, обновление изнутри, номер сборки"
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          export ANDROID_VERSION_NAME="$(node -e "import('./version.js').then(m => console.log(m.VERSION))")"
          python3 scripts/patch-android.py android
      - name: Собрать debug-APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Подготовить файл и показать отпечаток подписи
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/lifeos.apk
          ls -l out
          keytool -printcert -jarfile out/lifeos.apk | grep -E 'Owner|SHA256' || true
      - name: "Проверить, что подпись — наш постоянный ключ (иначе обновление поверх не поставится)"
        run: |
          EXPECTED='77:BC:5B:96:55:C2:65:E4:E6:6F:64:A6:60:79:CA:31:DB:C6:CC:76:1C:DF:CE:DB:71:F6:45:C1:65:99:A4:56'
          ACTUAL=$(keytool -printcert -jarfile out/lifeos.apk | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          echo "Ожидаемый отпечаток: $EXPECTED"
          echo "Фактический отпечаток: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-apk
          path: out/lifeos.apk
          if-no-files-found: error
      - name: Опубликовать как «последний APK» (прямая ссылка для телефона)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -e "import('./version.js').then(m => console.log(m.VERSION))")"
          NOTES="$(node -e "import('./changelog.js').then(m => console.log(JSON.stringify(m.CHANGELOG[0].items).replaceAll('--', '-')))")"
          # Первая строка — машиночитаемые сведения для кнопки «Обновить» в приложении (см. updater.js).
          cat > release-notes.md <<EOF
          <!-- lifeos-update {"version":"$VERSION","notes":$NOTES} -->
          Автосборка из коммита ${GITHUB_SHA::7}, версия $VERSION. Debug-подпись. Первый раз ставится вручную, дальше приложение обновляется кнопкой «Обновить» в профиле.
          EOF
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk out/lifeos.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Life OS $VERSION — последний APK" \
            --notes-file release-notes.md
