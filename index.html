<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--CSP-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Life OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock" class="lock" hidden>
  <div class="lock-card">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>Life OS</h1>
    <p class="muted">Введи пароль, чтобы открыть данные</p>
    <form id="lock-form" autocomplete="off">
      <div class="pw-wrap"><input id="lock-input" type="password" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль" required><button id="lock-reveal" type="button" class="reveal" aria-label="Показать или скрыть пароль">показать</button></div>
      <button id="lock-btn" type="submit" class="primary">Открыть</button>
    </form>
    <p id="lock-msg" class="error" role="alert"></p>
    <details id="forgot">
      <summary>Забыл пароль</summary>
      <p class="muted">Пароль восстановить нельзя. Можно стереть все данные на этом устройстве и начать заново; если у тебя есть резервная копия, потом её можно восстановить.</p>
      <input id="reset-confirm" type="text" placeholder="Напиши СТЕРЕТЬ" autocomplete="off">
      <button id="reset-btn" type="button" class="danger" disabled>Стереть всё и начать заново</button>
    </details>
  </div>
</div>

<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <img class="gate-logo" src="icons/icon-192.png" alt="" width="72" height="72">
    <h1 class="gate-title">Life OS</h1>
    <p class="muted gate-sub">Войди в аккаунт, чтобы открыть приложение</p>
    <div id="gate-body"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <h1 id="title">Сегодня</h1>
    <span id="status" class="status" title="Версия и режим"></span>
    <button id="sync-badge" type="button" class="sync-badge" hidden aria-label="Состояние синхронизации"></button>
    <button id="search-btn" type="button" class="icon-btn" aria-label="Поиск"></button>
    <button id="lock-top" type="button" class="icon-btn" aria-label="Заблокировать" hidden></button>
    <button id="profile-btn" type="button" class="avatar-btn" aria-label="Профиль"></button>
  </header>
  <nav id="subnav" class="subnav" aria-label="Разделы группы" hidden></nav>
  <div id="search-panel" class="search-panel" hidden>
    <input id="search-input" type="search" placeholder="Искать по задачам, привычкам, расходам, заметкам" autocomplete="off" aria-label="Поиск">
    <div id="search-results" class="results"></div>
  </div>
  <main id="view"></main>
  <nav id="tabs" aria-label="Разделы"></nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
