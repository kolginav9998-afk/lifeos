<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Life OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Сегодня</h1>
      <div id="date" class="date"></div>
    </div>
    <span id="status" class="status" title="Версия и режим"></span>
  </header>

  <form id="add-form" autocomplete="off">
    <div class="add-row">
      <input id="add-input" type="text" placeholder="Что нужно сделать?" enterkeyhint="done" maxlength="500" required>
      <button type="submit" aria-label="Добавить">+</button>
    </div>
    <div class="opts-row">
      <label>Срок <input id="add-due" type="date"></label>
      <label>Повтор
        <select id="add-repeat">
          <option value="">не повторять</option>
          <option value="daily">каждый день</option>
          <option value="weekly">каждую неделю</option>
          <option value="monthly">каждый месяц</option>
        </select>
      </label>
    </div>
  </form>

  <section id="g-overdue" hidden><h2 class="overdue">Просрочено</h2><ul class="list open"></ul></section>
  <section id="g-today" hidden><h2>Сегодня</h2><ul class="list open"></ul></section>
  <section id="g-upcoming" hidden><h2>Скоро</h2><ul class="list open"></ul></section>
  <section id="g-nodate" hidden><h2>Без срока</h2><ul class="list open"></ul></section>
  <p id="empty" class="muted" hidden>Пока пусто. Добавь первую задачу.</p>

  <details id="done-block">
    <summary>Сделано: <span id="done-count">0</span></summary>
    <ul id="done-list" class="list"></ul>
  </details>

  <details class="data">
    <summary>Данные</summary>
    <div class="row">
      <button id="export-btn" type="button">Экспорт JSON</button>
      <label class="btn">Импорт<input id="import-input" type="file" accept="application/json" hidden></label>
    </div>
    <p class="muted">Всё хранится только на этом телефоне. Экспорт — твоя резервная копия.</p>
    <p id="msg" class="muted" role="status"></p>
  </details>
  <pre id="diag" class="diag" aria-label="Диагностика хранилища"></pre>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
